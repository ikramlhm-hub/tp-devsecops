name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # =========================
  # 1. Lint & Tests unitaires
  # =========================
  test:
    name: Lint & Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # =========================
  # 2. Sécurité (SAST + audit deps)
  # =========================
  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: npm audit (vulnérabilités dans les dépendances)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '0'

  # =========================
  # 3. Build & push Docker
  # =========================
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push for student version)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: helpdesk:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan de l'image Docker
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'helpdesk:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

 # =========================
  # 4. Deploy VPS (main uniquement)
  # =========================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test, security, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ikram279/helpdesk:latest

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            docker pull ikram279/helpdesk:latest
            docker rm -f helpdesk-app || true
            docker run -d -p 80:3000 \
              --name helpdesk-app \
              --restart unless-stopped \
              -e JWT_SECRET="$(openssl rand -base64 32)" \
              -e DATABASE_URL="file:/app/data/dev.db" \
              ikram279/helpdesk:latest
            docker cp /tmp/dev.db helpdesk-app:/app/data/dev.db || true
